# Lance automatiquement les tests à chaque push et à chaque pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Back-end (Django + pytest)
    runs-on: ubuntu-latest

    # Base PostgreSQL de test, comme dans Docker Compose
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: erp_agro
          POSTGRES_USER: erp_agro
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_agro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: erp_agro
      POSTGRES_USER: erp_agro
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pour-la-ci
      DJANGO_DEBUG: "False"
      CELERY_BROKER_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Vérifier le style du code (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run
      - name: Lancer les tests (pytest)
        run: pytest

  frontend:
    name: Front-end (React + Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier le code (ESLint)
        run: npm run lint
      - name: Lancer les tests (Vitest)
        run: npm test
      - name: Vérifier que l'application se compile
        run: npm run build
